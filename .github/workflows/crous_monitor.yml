name: CROUS 24/7 Housing Monitor

on:
  schedule:
    # Runs automatically every hour as a safety net
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual 1-click start from the GitHub Actions tab

concurrency:
  group: crous-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CROUS Watcher for 55 minutes (checks every 10s)
        run: |
          python3 ./crous_watcher.py --max-minutes 55

      - name: Save updated state cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crous_state.json
          git diff --staged --quiet || (git commit -m "chore: update crous_state.json [skip ci]" && git push)

